# FRC inspect example; schema matches refine template / inspect peaks configs.
# Call `PeakInspectionManager.from_yaml(path)` to load this file.
template_volume_path: /some/path/to/template.mrc
particle_stack:
  df_path: /some/path/to/particles.csv  # Needs to be readable by pandas
  # IMPORTANT: for FRC inspect, keep extracted_box_size equal to original_template_size.
  extracted_box_size: [512, 512]
  original_template_size: [512, 512]
defocus_refinement_config:
  # Single defocus hypothesis (no defocus search).
  enabled: false
  defocus_max: 100.0
  defocus_min: -100.0
  defocus_step: 20.0
orientation_refinement_config:
  # Single orientation hypothesis (no orientation search).
  enabled: false
pixel_size_refinement_config:
  enabled: false
  pixel_size_min: -0.005
  pixel_size_max: 0.005
  pixel_size_step: 0.001
preprocessing_filters:
  whitening_filter:
    do_power_spectrum: true
    enabled: true
    max_freq: 0.5
    num_freq_bins: null
  bandpass_filter:
    enabled: false
    falloff: null
    high_freq_cutoff: null
    low_freq_cutoff: null
computational_config:
  gpu_ids: 0
  num_cpus: 1
apply_global_filtering: true
movie_config:
  enabled: false
  movie_path: path/to/aligned_movie.mrc
  deformation_field_path: path/to/deformation_field.csv
  pre_exposure: 0.0
  fluence_per_frame: 1.0
